<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя аптека</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>Домашняя аптека</h1>
        
        <!-- Форма добавления лекарства -->
        <div class="form-section">
            <h2>Добавить лекарство</h2>
            <form id="medicineForm">
                <input type="text" id="name" placeholder="Название лекарства" required>
                <textarea id="purpose" placeholder="Назначение" required></textarea>
                <input type="date" id="expiryDate" placeholder="Срок годности" required>
                <button type="submit">Добавить</button>
            </form>
            
            <!-- Кнопки экспорта/импорта -->
            <div class="data-controls">
                <button id="downloadBtn" type="button">📥 Скачать список (JSON)</button>
                <label style="margin-left: 10px; cursor: pointer;">
                    📤 Загрузить список (JSON)
            <input type="file" id="uploadInput" accept=".json" style="display: none;" />
                </label>
            </div>
        </div>

        <!-- Элементы управления сортировкой и фильтром -->
        <div class="controls">
            <button id="sortByNameBtn">Сортировать по названию (А–Я)</button>
            <div class="filter-section">
                <label for="purposeFilter">Фильтр по назначению:</label>
                <input type="text" id="purposeFilter" placeholder="Введите ключевое слово...">
                <button id="clearFilterBtn">Очистить фильтр</button>
            </div>
        </div>

        <!-- Таблица всех лекарств -->
        <div class="table-section">
            <h2>Все лекарства</h2>
            <table id="medicinesTable">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Назначение</th>
                        <th>Срок годности</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Сюда будут добавляться строки с лекарствами -->
                </tbody>
            </table>
        </div>

        <!-- Список лекарств с истекающим сроком -->
        <div class="expiring-section">
            <h2>Скоро истекает срок годности (менее 1 месяца)</h2>
            <div id="expiringList">
                <!-- Сюда будут выводиться лекарства с истекающим сроком -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
